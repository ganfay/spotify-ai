; Spotify's own colours, written out, so that the client looks exactly as it does
; without a theme. Other looks are applied on top at run time by spotify-ai-core.js
; (they are chosen in AI Playlists > Appearance), not by editing this file.
[base]
text               = FFFFFF
subtext            = B3B3B3
main               = 121212
main-elevated      = 242424
highlight          = 1A1A1A
highlight-elevated = 2A2A2A
sidebar            = 000000
player             = 181818
card               = 282828
shadow             = 000000
selected-row       = FFFFFF
button             = 1DB954
button-active      = 1ED760
button-disabled    = 535353
tab-active         = 333333
notification       = 4687D6
notification-error = E22134
misc               = 7F7F7F
