# Real installs on GitHub's Windows and macOS machines. Started by hand only
# (Actions tab > installer-smoke > Run workflow): it downloads Spotify each time.
# It proves that the installer runs and patches Spotify; it cannot hear ads or
# look at the interface.
name: installer-smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: powershell   # Windows PowerShell 5.1, what users have
    steps:
      - uses: actions/checkout@v4
      - name: Syntax (PowerShell 5.1)
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD\install.ps1", [ref]$null, [ref]$errors)
          if ($errors) { $errors | ForEach-Object { Write-Host $_ }; exit 1 }
      - name: Install (from the folder)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1 -NoLaunch
      - name: Check the result
        run: |
          $xpui = "$env:APPDATA\Spotify\Apps\xpui"
          (Get-Item "$env:APPDATA\Spotify\Spotify.exe").VersionInfo | Format-List FileVersion, ProductVersion
          if (-not (Test-Path "$xpui\extensions\spotify-ai-adblock.js")) { throw 'extension missing' }
          if (-not (Test-Path "$xpui\spicetify-routes-ai-playlists*")) { throw 'app missing' }
          Get-Content "$env:APPDATA\spicetify\config-xpui.ini"
          $update = "$env:LOCALAPPDATA\Spotify\Update"
          Get-Item $update -Force | Format-List Mode, Attributes, Length
          (Get-Acl $update).Access | Format-Table IdentityReference, AccessControlType, FileSystemRights
          $deleted = $true
          try { Remove-Item $update -Recurse -Force -ErrorAction Stop } catch { $deleted = $false; Write-Host "delete refused: $($_.Exception.Message)" }
          if ($deleted) { throw 'the update block could be deleted' }
          $made = $true
          try { New-Item -ItemType Directory "$update\x" -ErrorAction Stop | Out-Null } catch { $made = $false }
          if ($made) { throw 'a folder could be created inside the update block' }
      - name: Install again (repair), switches changed
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1 -NoLaunch -Adblock off
          if (Test-Path "$env:APPDATA\Spotify\Apps\xpui\extensions\spotify-ai-adblock.js") { throw 'extension still applied' }
      - name: Install by "irm | iex" (files served locally)
        run: |
          $server = Start-Process python -ArgumentList '-m', 'http.server', '8765', '--bind', '127.0.0.1' -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 3
          $env:SPOTIFY_AI_BASE_URL = 'http://127.0.0.1:8765'
          Invoke-RestMethod http://127.0.0.1:8765/install.ps1 | Invoke-Expression
          Stop-Process -Id $server.Id -Force
          Get-Process -Name Spotify -ErrorAction SilentlyContinue | Stop-Process -Force
          if (Test-Path "$env:APPDATA\Spotify\Apps\xpui\extensions\spotify-ai-adblock.js") { throw 'the saved "adblock off" choice was not kept' }
          if (-not (Test-Path "$env:APPDATA\Spotify\Apps\xpui\spicetify-routes-ai-playlists*")) { throw 'app missing' }
      - name: Uninstall
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1 -Uninstall
          if (Test-Path "$env:APPDATA\Spotify\Apps\xpui") { throw 'Spotify files not restored' }
          if (-not (Test-Path "$env:APPDATA\Spotify\Apps\xpui.spa")) { throw 'xpui.spa missing' }
          if (Test-Path "$env:LOCALAPPDATA\Spotify\Update") { throw 'update block not removed' }
          if (Test-Path "$env:LOCALAPPDATA\spicetify") { throw 'Spicetify not removed' }
  macos:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Syntax (the bash that macOS ships)
        run: /bin/bash --version | head -1 && /bin/bash -n install.sh
      - name: Install (from the folder)
        run: /bin/bash install.sh
      - name: Check the result
        run: |
          R=/Applications/Spotify.app/Contents/Resources
          defaults read /Applications/Spotify.app/Contents/Info CFBundleShortVersionString
          test -f "$R/Apps/xpui/extensions/spotify-ai-adblock.js"
          ls "$R/Apps/xpui" | grep spicetify-routes-ai-playlists
          cat ~/.config/spicetify/config-xpui.ini
          U="$HOME/Library/Application Support/Spotify/PersistentCache/Update"
          ls -ldO "$U"
          if touch "$U/x" 2>/dev/null; then echo "a file could be created in the locked folder"; exit 1; fi
          codesign --verify --deep --strict /Applications/Spotify.app && echo "signature: still valid" || echo "signature: no longer valid (expected after patching)"
          sleep 5; pkill -x Spotify || true
      - name: Patched Spotify still starts
        run: |
          open /Applications/Spotify.app
          sleep 20
          pgrep -x Spotify && echo "running"
          osascript -e 'quit app "Spotify"' || pkill -x Spotify || true
      - name: Install again by "curl | bash" (files served locally), switches changed
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/dev/null 2>&1 &
          sleep 2
          curl -fsSL http://127.0.0.1:8765/install.sh | SPOTIFY_AI_BASE_URL=http://127.0.0.1:8765 /bin/bash -s -- --adblock off
          sleep 3; pkill -x Spotify || true
          test ! -f /Applications/Spotify.app/Contents/Resources/Apps/xpui/extensions/spotify-ai-adblock.js
      - name: Uninstall
        run: |
          /bin/bash install.sh --uninstall
          R=/Applications/Spotify.app/Contents/Resources
          test ! -d "$R/Apps/xpui"
          test -f "$R/Apps/xpui.spa"
          test ! -e "$HOME/Library/Application Support/Spotify/PersistentCache/Update"
          test ! -e ~/.spicetify
