name: check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The committed bundle must be exactly what the source builds:
      # nobody can slip code into agent/release/ without it showing here.
      - run: node build.mjs
      - run: diff -r dist/ai-playlists release/ai-playlists
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n install.sh
      - run: sudo apt-get install -y shellcheck && shellcheck -S warning install.sh
      - name: install.ps1 parses and is plain ASCII
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$null, [ref]$errors)
          if ($errors) { $errors | ForEach-Object { Write-Host $_ }; exit 1 }
          if (Select-String -Path install.ps1 -Pattern '[^\x00-\x7F]' -CaseSensitive) { Write-Host 'non-ASCII characters in install.ps1'; exit 1 }
      - name: Translated installer messages are generated from scripts/dev/installer-texts.json
        run: python3 scripts/dev/gen-installer-texts.py && git diff --exit-code install.sh install.ps1
      - name: Windows launchers keep CRLF line endings
        run: |
          for f in install.cmd uninstall.cmd; do
            [ "$(grep -c $'\r$' "$f")" = "$(wc -l < "$f")" ] || { echo "$f has lines without CRLF"; exit 1; }
          done
